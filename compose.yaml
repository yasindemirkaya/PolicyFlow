name: policyflow

services:
  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile.dev
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --webpack --hostname 0.0.0.0
    init: true
    networks:
      - policyflow-network

  # Legacy Monolithic Backend
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile.dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_HOST: policyflow-postgres
      DB_PORT: "5432"
    command: npm run dev
    init: true
    networks:
      - policyflow-network

  # Customer Microservice
  customer-service:
    build:
      context: ./services/customer-service
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3002:3000"
    volumes:
      - ./services/customer-service:/app
      - customer_service_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
    command: sleep infinity
    init: true
    networks:
      - policyflow-network

  # Product Microservice
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3003:3000"
    volumes:
      - ./services/product-service:/app
      - product_service_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
    command: sleep infinity
    init: true
    networks:
      - policyflow-network

  # Proposal Microservice
  proposal-service:
    build:
      context: ./services/proposal-service
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3004:3000"
    volumes:
      - ./services/proposal-service:/app
      - proposal_service_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
    command: sleep infinity
    init: true
    networks:
      - policyflow-network

volumes:
  frontend_node_modules:
  frontend_next:
  backend_node_modules:
  customer_service_node_modules:
  product_service_node_modules:
  proposal_service_node_modules:

networks:
  policyflow-network:
    external: true