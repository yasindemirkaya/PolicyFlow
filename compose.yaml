name: policyflow

services:
  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile.dev
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --webpack --hostname 0.0.0.0
    init: true
    networks:
      - policyflow-network

  # Customer Microservice
  customer-service:
    build:
      context: ./services/customer-service
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3002:3000"
    volumes:
      - ./services/customer-service:/app
      - customer_service_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
    # Container başladığında Customer Service uygulamasını çalıştırır.
    command: npm run dev
    init: true
    networks:
      - policyflow-network

  # Product Microservice
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3003:3000"
    volumes:
      - ./services/product-service:/app
      - product_service_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
    # Container başladığında Product Service uygulamasını çalıştırır.
    command: npm run dev
    init: true
    networks:
      - policyflow-network

  # Proposal Microservice
  proposal-service:
    build:
      context: ./services/proposal-service
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3004:3000"
    volumes:
      - ./services/proposal-service:/app
      - proposal_service_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
    # Container başladığında Proposal Service uygulamasını çalıştırır.
    command: npm run dev
    init: true
    networks:
      - policyflow-network

  # Policy Microservice
  policy-service:
    build:
      context: ./services/policy-service
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3005:3000"
    volumes:
      - ./services/policy-service:/app
      - policy_service_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
    # Container başladığında Policy Service uygulamasını çalıştırır.
    command: npm run dev
    init: true
    networks:
      - policyflow-network

  # Integration Microservice
  integration-service:
    build:
      context: ./services/integration-service
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./services/integration-service:/app
      - integration_service_node_modules:/app/node_modules
    env_file:
      - ./services/integration-service/.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      RABBITMQ_HOST: policyflow-rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_VHOST: policyflow
    # Container başladığında Integration Service uygulamasını ve Consumer'ları çalıştırır.
    command: npm run dev
    init: true
    networks:
      - policyflow-network


  # Analytics Microservice
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3007:3000"
    volumes:
      - ./services/analytics-service:/app
      - analytics_service_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
    command: npm run dev
    init: true
    networks:
      - policyflow-network
      
  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3006:3000"
    volumes:
      - ./api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
    # Container başladığında API Gateway uygulamasını çalıştırır.
    command: npm run dev
    init: true
    networks:
      - policyflow-network

volumes:
  frontend_node_modules:
  frontend_next:
  backend_node_modules:
  customer_service_node_modules:
  product_service_node_modules:
  proposal_service_node_modules:
  policy_service_node_modules:
  integration_service_node_modules:
  api_gateway_node_modules:
  analytics_service_node_modules:

networks:
  policyflow-network:
    external: true